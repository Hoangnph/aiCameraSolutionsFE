version: '3.8'

services:
  face-detection-api:
    build:
      context: .
      dockerfile: Dockerfile
      target: development
    container_name: face-detection-system
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
      - ./uploads:/app/uploads
      - ./logs:/app/logs
      - ./automation_test:/app/automation_test
      - .:/app
    environment:
      - PYTHONPATH=/app
      - DEBUG=true
      - HOST=0.0.0.0
      - PORT=8000
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - face-detection-network

  # Optional: Redis for caching (future enhancement)
